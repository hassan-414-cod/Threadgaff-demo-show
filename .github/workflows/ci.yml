name: Frontend NG CI

on:
  push:
    paths:
      - 'frontend-ng/**'
  pull_request:
    paths:
      - 'frontend-ng/**'

defaults:
  run:
    working-directory: frontend-ng

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-ng/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration=development
